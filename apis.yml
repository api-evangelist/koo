name: Koo
description: 'Koo was an Indian microblogging and social networking platform built by Bombinate
  Technologies, positioned as a multilingual, India-first alternative to Twitter/X with support for
  Hindi, Kannada, Tamil, Telugu, Marathi and other regional languages. Backed by Accel and Tiger
  Global, it grew during the 2021 Indian social-media policy disputes before ceasing operations in
  2024 after funding and acquisition talks fell through. Koo never published a public developer
  portal, API documentation, or client SDKs, and its domain no longer serves a site — this profile is
  retained as a verified-defunct historical record rather than an active API provider.'
